<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24343b;
      --cream: #fff8ed;
      --teal: #176b73;
      --coral: #ec765d;
      --sun: #ffd77e;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #e1f0e9;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    svg {
      display: block;
      width: min(1240px, 100vw);
      height: min(780px, calc(100vh - 36px));
      min-height: 520px;
      overflow: hidden;
      border-radius: 24px;
      background: #a9dce0;
      box-shadow: 0 28px 75px rgba(25, 73, 76, .24), 0 4px 12px rgba(25, 73, 76, .14);
    }

    .copy {
      position: absolute;
      top: clamp(34px, 7vh, 72px);
      left: max(34px, calc(50% - 560px));
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(255, 248, 237, .78);
    }

    .copy .eyebrow {
      margin: 0 0 6px;
      color: #236870;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
    }

    .copy h1 {
      margin: 0;
      color: #183d46;
      font-family: Georgia, "Microsoft YaHei", serif;
      font-size: clamp(25px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: .08em;
    }

    .copy p {
      margin: 8px 0 0;
      color: #356c70;
      font-size: 13px;
      letter-spacing: .12em;
    }

    .control {
      position: absolute;
      top: clamp(34px, 7vh, 72px);
      right: max(34px, calc(50% - 560px));
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 248, 237, .86);
      border-radius: 50%;
      background: rgba(255, 248, 237, .7);
      color: #236870;
      box-shadow: 0 8px 20px rgba(35, 104, 112, .14);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .control:hover { transform: translateY(-2px); background: #fff8ed; }
    .control:focus-visible { outline: 3px solid rgba(236, 118, 93, .58); outline-offset: 4px; }
    .control svg { width: 20px; height: 20px; min-height: 0; border-radius: 0; box-shadow: none; }
    .control .pause-icon { display: none; }
    .control.is-playing .play-icon { display: none; }
    .control.is-playing .pause-icon { display: block; }

    .caption {
      position: absolute;
      right: max(34px, calc(50% - 560px));
      bottom: clamp(32px, 5vh, 54px);
      color: rgba(255, 248, 237, .88);
      font-size: 11px;
      letter-spacing: .16em;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .stage { padding: 0; }
      svg { width: 100vw; height: 100vh; min-height: 0; border-radius: 0; }
      .copy { top: 28px; left: 24px; }
      .copy h1 { font-size: 27px; }
      .copy p { font-size: 11px; letter-spacing: .08em; }
      .control { top: 28px; right: 22px; }
      .caption { right: 24px; bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>

    <div class="copy">
      <p class="eyebrow">COASTAL MORNING RIDE</p>

    <button class="control is-playing" id="motionToggle" type="button" aria-label="暂停动画" title="暂停动画">
      <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
    <div class="caption">SVG 2D · PEDAL POWERED</div>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('#motionToggle');
    let running = true;
    let frozenPhase = 0;

    toggle.addEventListener('click', () => {
      if (running) frozenPhase = performance.now() / 1000 * 5.2;
      running = !running;
      root.classList.toggle('paused', !running);
      toggle.classList.toggle('is-playing', running);
      toggle.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
      toggle.title = running ? '暂停动画' : '播放动画';
    });

    const hip = { x: 568, y: 436 };
    const hub = { x: 676, y: 606 };
    const thigh = document.querySelector('#rider .pedaling path:nth-child(1)');
    const shin = document.querySelector('#rider .pedaling path:nth-child(2)');
    const foot = document.querySelector('#rider .pedaling path:nth-child(3)');
    const thighBack = document.querySelector('#rider .pedaling path:nth-child(4)');
    const shinBack = document.querySelector('#rider .pedaling path:nth-child(5)');
    const footBack = document.querySelector('#rider .pedaling path:nth-child(6)');

    function setLine(path, a, b) {
      path.setAttribute('d', `M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
    }

    function solveLeg(phase, thighPath, shinPath, footPath) {
      const ankle = { x: hub.x + 43 * Math.cos(phase), y: hub.y + 43 * Math.sin(phase) };
      const dx = ankle.x - hip.x;
      const dy = ankle.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const upper = 95;
      const lower = 130;
      const reach = Math.min(distance, upper + lower - .5);
      const along = reach / 2;
      const bend = Math.sqrt(Math.max(upper * upper - along * along, 0));
      const ux = dx / distance;
      const uy = dy / distance;
      const knee = { x: hip.x + ux * along + uy * bend, y: hip.y + uy * along - ux * bend };
      setLine(thighPath, hip, knee);
      setLine(shinPath, knee, ankle);
      footPath.setAttribute('d', `M${(ankle.x - 18).toFixed(1)} ${(ankle.y + 8).toFixed(1)} q18 7 35-5 l-6 19 q-21 11-39-2Z`);
    }

    function animate(now) {
      const seconds = running ? now / 1000 : frozenPhase / 5.2;
      const phase = seconds * 5.2;
      solveLeg(phase, thigh, shin, foot);
      solveLeg(phase + Math.PI, thighBack, shinBack, footBack);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>

  <style>
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    .cloud-a { animation: cloudA 38s linear infinite; }
    .cloud-b { animation: cloudB 52s linear infinite; }
    .cloud-c { animation: cloudC 45s linear infinite; }
    .water-lines { animation: water 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .road-marks { animation: road 2.3s linear infinite; }
    .spokes { animation: spin 1.05s linear infinite; transform-box: fill-box; transform-origin: center; }
    .crank { animation: spin 1.05s linear infinite; transform-box: fill-box; transform-origin: 676px 606px; }
    .body-bob { animation: bob .56s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .wing { animation: wing .82s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 615px 353px; }
    .scarf { animation: scarf .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 632px 311px; }
    .eye { animation: blink 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .speed-lines { animation: speed 1.1s ease-out infinite; }
    .dust { animation: dust 1.7s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-5px) rotate(-.9deg); } }
    @keyframes wing { to { transform: rotate(7deg); } }
    @keyframes scarf { from { transform: rotate(-4deg); } to { transform: rotate(8deg) translateX(-5px); } }
    @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } 97% { transform: scaleY(1); } }
    @keyframes cloudA { from { transform: translateX(-260px); } to { transform: translateX(1280px); } }
    @keyframes cloudB { from { transform: translateX(620px); } to { transform: translateX(-700px); } }
    @keyframes cloudC { from { transform: translateX(420px); } to { transform: translateX(-740px); } }
    @keyframes water { from { transform: translateX(-10px); } to { transform: translateX(18px); } }
    @keyframes road { to { stroke-dashoffset: -264px; } }
    @keyframes speed { 0%, 100% { opacity: 0; transform: translateX(30px); } 30% { opacity: .74; } 70% { opacity: .72; } }
    @keyframes dust { 0% { opacity: 0; transform: translate(28px, 5px) scale(.4); } 25% { opacity: .7; } 100% { opacity: 0; transform: translate(-90px, -25px) scale(1.5); } }
  </style>
</body>
</html>
