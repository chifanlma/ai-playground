<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行 · Le Pélican à Bicyclette</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #e9decb; font-family: Georgia, serif; }
  .card { width: min(92vw, 880px); border-radius: 18px; overflow: hidden;
          box-shadow: 0 24px 60px rgba(90,70,40,.25), 0 4px 14px rgba(90,70,40,.12); }
  svg { display: block; width: 100%; height: auto; }

  /* ---- 动画 ---- */
  .spokes-r, .spokes-f, .crank, .pedal-n, .pedal-f, .leg-n, .leg-f,
  .head, .scarf, .halo, .clouds { transform-box: view-box; }

  .spokes-r { transform-origin: 280px 460px; animation: spin 2s linear infinite; }
  .spokes-f { transform-origin: 560px 460px; animation: spin 2s linear infinite; }
  .crank    { transform-origin: 400px 460px; animation: spin 2s linear infinite; }
  .pedal-n  { transform-origin: 428px 488px; animation: spinRev 2s linear infinite; }
  .pedal-f  { transform-origin: 372px 432px; animation: spinRev 2s linear infinite; }
  .leg-n    { transform-origin: 330px 305px; animation: legA 2s ease-in-out infinite; }
  .leg-f    { transform-origin: 340px 310px; animation: legB 2s ease-in-out infinite; }
  .bird     { animation: bob 2s ease-in-out infinite; }
  .head     { transform-origin: 450px 160px; animation: nod 2s ease-in-out infinite; }
  .scarf    { transform-origin: 409px 214px; animation: flutter 2s ease-in-out infinite; }
  .halo     { transform-origin: 690px 92px;  animation: breathe 4s ease-in-out infinite; }
  .clouds   { animation: drift 18s ease-in-out infinite; }
  .dashes   { animation: road 2s linear infinite; }
  .trees    { animation: scenery 7s linear infinite; }
  .bushes   { animation: scenery 5s linear infinite; }
  .speed    { animation: pulse 2s ease-in-out infinite; }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes legA  { 0%,100% { transform: rotate(4deg); }  50% { transform: rotate(-5deg); } }
  @keyframes legB  { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(4deg); } }
  @keyframes bob     { 0%,100% { transform: translateY(0); }    50% { transform: translateY(-2.5px); } }
  @keyframes nod     { 0%,100% { transform: rotate(1.4deg); }   50% { transform: rotate(-1.4deg); } }
  @keyframes flutter { 0%,100% { transform: rotate(2deg); }     50% { transform: rotate(-6deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); }         50% { transform: scale(1.08); } }
  @keyframes drift   { 0%,100% { transform: translateX(0); }    50% { transform: translateX(-26px); } }
  @keyframes road    { to { transform: translateX(-110px); } }
  @keyframes scenery { to { transform: translateX(-400px); } }
  @keyframes pulse   { 0%,100% { opacity: .85; } 50% { opacity: .3; } }

  @media (prefers-reduced-motion: reduce) {
    .spokes-r, .spokes-f, .crank, .pedal-n, .pedal-f, .leg-n, .leg-f,
    .bird, .head, .scarf, .halo, .clouds, .dashes, .trees, .bushes, .speed { animation: none; }
  }
</style>
</head>
<body>
<div class="card">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0e1"/>
      <stop offset="1" stop-color="#efe3cb"/>
    </linearGradient>
    <g id="tree">
      <rect x="-5" y="-30" width="10" height="32" rx="4" fill="#a89a80"/>
      <ellipse cx="0" cy="-46" rx="27" ry="25" fill="#b3bfa0"/>
      <ellipse cx="-10" cy="-55" rx="13" ry="11" fill="#c3cdae"/>
    </g>
    <g id="bush">
      <ellipse cx="0" cy="-6" rx="20" ry="9" fill="#c3cdae"/>
      <ellipse cx="13" cy="-11" rx="11" ry="7" fill="#b3bfa0"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle class="halo" cx="690" cy="92" r="58" fill="#f0d9a8" opacity="0.4"/>
  <circle cx="690" cy="92" r="38" fill="#eed3a0"/>

  <!-- clouds -->
  <g class="clouds" fill="#fbf8f0" opacity="0.9">
    <ellipse cx="170" cy="110" rx="46" ry="18"/>
    <ellipse cx="145" cy="100" rx="26" ry="14"/>
    <ellipse cx="195" cy="98" rx="24" ry="13"/>
    <ellipse cx="540" cy="66" rx="36" ry="14"/>
    <ellipse cx="520" cy="58" rx="20" ry="11"/>
    <ellipse cx="560" cy="57" rx="18" ry="10"/>
  </g>

  <!-- distant birds -->
  <g fill="none" stroke="#b5ad9a" stroke-width="2.5" stroke-linecap="round">
    <path d="M 300 128 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M 252 152 q 6 -6 12 0 q 6 -6 12 0"/>
  </g>

  <!-- hills -->
  <path d="M 0 548 C 160 498 340 512 520 534 C 650 550 730 520 800 530 L 800 600 L 0 600 Z" fill="#dfe2cf"/>

  <!-- trees on the hillside -->
  <g class="trees">
    <use href="#tree" x="120" y="547"/>
    <use href="#tree" x="520" y="547"/>
    <use href="#tree" x="920" y="547"/>
  </g>

  <!-- road -->
  <rect x="0" y="548" width="800" height="52" fill="#d8d1c2"/>
  <line x1="0" y1="548" x2="800" y2="548" stroke="#c6bfae" stroke-width="2"/>
  <g class="dashes" fill="#efe9da">
    <rect x="20" y="574" width="44" height="5" rx="2.5"/>
    <rect x="130" y="574" width="44" height="5" rx="2.5"/>
    <rect x="240" y="574" width="44" height="5" rx="2.5"/>
    <rect x="350" y="574" width="44" height="5" rx="2.5"/>
    <rect x="460" y="574" width="44" height="5" rx="2.5"/>
    <rect x="570" y="574" width="44" height="5" rx="2.5"/>
    <rect x="680" y="574" width="44" height="5" rx="2.5"/>
    <rect x="790" y="574" width="44" height="5" rx="2.5"/>
  </g>

  <!-- foreground bushes -->
  <g class="bushes">
    <use href="#bush" x="260" y="596"/>
    <use href="#bush" x="660" y="596"/>
    <use href="#bush" x="1060" y="596"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="550" rx="235" ry="11" fill="#6b6154" opacity="0.15"/>

  <!-- rear wheel -->
  <circle cx="280" cy="460" r="90" fill="none" stroke="#4e4b45" stroke-width="10"/>
  <g class="spokes-r">
    <circle cx="280" cy="460" r="80" fill="none" stroke="#b7b0a2" stroke-width="3"/>
    <g stroke="#b7b0a2" stroke-width="2.5">
      <line x1="194" y1="460" x2="366" y2="460"/>
      <line x1="205.5" y1="417" x2="354.5" y2="503"/>
      <line x1="237" y1="385.5" x2="323" y2="534.5"/>
      <line x1="280" y1="374" x2="280" y2="546"/>
    </g>
  </g>
  <circle cx="280" cy="460" r="8" fill="#6e9694"/>

  <!-- front wheel -->
  <circle cx="560" cy="460" r="90" fill="none" stroke="#4e4b45" stroke-width="10"/>
  <g class="spokes-f">
    <circle cx="560" cy="460" r="80" fill="none" stroke="#b7b0a2" stroke-width="3"/>
    <g stroke="#b7b0a2" stroke-width="2.5">
      <line x1="474" y1="460" x2="646" y2="460"/>
      <line x1="485.5" y1="417" x2="634.5" y2="503"/>
      <line x1="517" y1="385.5" x2="603" y2="534.5"/>
      <line x1="560" y1="374" x2="560" y2="546"/>
    </g>
  </g>
  <circle cx="560" cy="460" r="8" fill="#6e9694"/>

  <!-- drivetrain -->
  <circle cx="280" cy="460" r="9" fill="none" stroke="#857f72" stroke-width="3"/>
  <circle cx="400" cy="460" r="17" fill="none" stroke="#857f72" stroke-width="4"/>
  <line x1="280" y1="451" x2="400" y2="443" stroke="#857f72" stroke-width="3" stroke-dasharray="5 3"/>
  <line x1="280" y1="469" x2="400" y2="477" stroke="#857f72" stroke-width="3" stroke-dasharray="5 3"/>

  <!-- frame -->
  <g fill="none" stroke="#6e9694" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 280 460 L 400 460 L 368 335 Z"/>
    <line x1="368" y1="335" x2="537" y2="332"/>
    <line x1="400" y1="460" x2="540" y2="352"/>
    <line x1="560" y1="460" x2="534" y2="318"/>
  </g>

  <!-- cranks & pedals (pedals counter-rotate to stay level) -->
  <g class="crank" fill="none" stroke="#5b5850" stroke-width="7" stroke-linecap="round">
    <line x1="400" y1="460" x2="428" y2="488"/>
    <line x1="400" y1="460" x2="372" y2="432"/>
    <g class="pedal-n"><rect x="413" y="483.5" width="30" height="9" rx="3.5" fill="#3f3c37" stroke="none"/></g>
    <g class="pedal-f"><rect x="357" y="427.5" width="30" height="9" rx="3.5" fill="#55524b" stroke="none"/></g>
  </g>

  <!-- stem & handlebar -->
  <path d="M 534 318 L 529 300 C 521 290 503 289 495 298" fill="none" stroke="#5b5850" stroke-width="7" stroke-linecap="round"/>
  <circle cx="495" cy="298" r="5" fill="#3f3c37"/>

  <!-- seat -->
  <line x1="368" y1="335" x2="363" y2="316" stroke="#5b5850" stroke-width="7" stroke-linecap="round"/>
  <path d="M 336 314 Q 362 304 392 312 Q 364 322 336 314 Z" fill="#4e4b45"/>

  <!-- the pelican (bobbing as a whole) -->
  <g class="bird">
    <!-- far leg -->
    <g class="leg-f">
      <path d="M 340 310 L 384 386 L 370 428" fill="none" stroke="#c07f30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 364 424 L 394 429 L 370 440 Z" fill="#c07f30"/>
    </g>

    <!-- tail -->
    <path d="M 240 232 L 182 206 L 232 244 Z" fill="#e3d8c4"/>
    <path d="M 242 246 L 192 232 L 236 258 Z" fill="#d5c8b0"/>

    <!-- body -->
    <ellipse cx="315" cy="252" rx="92" ry="60" fill="#f6f1e7" stroke="#d8cdb9" stroke-width="2.5"/>
    <ellipse cx="315" cy="280" rx="76" ry="26" fill="#e8ddc9"/>

    <!-- near leg -->
    <g class="leg-n">
      <path d="M 330 305 L 396 388 L 426 482" fill="none" stroke="#d9913e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 420 478 L 454 484 L 426 496 Z" fill="#d9913e"/>
    </g>

    <!-- wing -->
    <ellipse cx="308" cy="258" rx="54" ry="34" fill="#ece1cc" transform="rotate(-10 308 258)"/>
    <g fill="none" stroke="#cfc2a8" stroke-width="2.5" stroke-linecap="round">
      <path d="M 282 244 Q 306 252 330 272"/>
      <path d="M 272 260 Q 298 268 320 288"/>
      <path d="M 266 276 Q 290 284 308 300"/>
    </g>

    <!-- neck -->
    <path d="M 380 218 C 424 210 450 196 450 158" fill="none" stroke="#d8cdb9" stroke-width="33" stroke-linecap="round"/>
    <path d="M 380 218 C 424 210 450 196 450 158" fill="none" stroke="#f6f1e7" stroke-width="26" stroke-linecap="round"/>

    <!-- scarf -->
    <g class="scarf">
      <path d="M 392 204 Q 410 196 426 198 L 429 214 Q 411 216 395 222 Z" fill="#c17b6b"/>
      <path d="M 396 218 L 366 240 L 392 242 Z" fill="#b06a5a"/>
    </g>

    <!-- head -->
    <g class="head">
      <path d="M 432 126 Q 420 114 408 116 Q 418 122 424 132 Z" fill="#e3d8c4"/>
      <circle cx="450" cy="146" r="25" fill="#f6f1e7" stroke="#d8cdb9" stroke-width="2"/>
      <circle cx="454" cy="129" r="5" fill="#3f3a33"/>
      <circle cx="455.7" cy="127.3" r="1.7" fill="#ffffff"/>
      <path d="M 464 156 C 476 200 534 202 580 170 L 464 156 Z" fill="#eab263" stroke="#d1913b" stroke-width="1"/>
      <path d="M 458 134 Q 528 146 584 164 Q 590 168 583 172 L 462 156 Q 455 145 458 134 Z" fill="#dd9a44" stroke="#c9873a" stroke-width="1"/>
      <path d="M 468 160 C 482 190 532 192 574 170" fill="none" stroke="#d1913b" stroke-width="1.5"/>
      <line x1="466" y1="146" x2="552" y2="160" stroke="#c9873a" stroke-width="1" opacity="0.6"/>
    </g>
  </g>

  <!-- speed lines -->
  <g class="speed" stroke="#c9c2b2" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="96" y1="250" x2="136" y2="250"/>
    <line x1="84" y1="290" x2="112" y2="290"/>
    <line x1="108" y1="330" x2="142" y2="330"/>
  </g>

  <!-- caption -->
  <text x="40" y="54" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#8a7a63">Le Pélican à Bicyclette</text>
  <text x="41" y="80" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#a3947c">鹈鹕骑行 · 一八九七</text>
</svg>
</div>
</body>
</html>
