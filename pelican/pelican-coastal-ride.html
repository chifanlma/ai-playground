<style>

er{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:1px;color:var(--muted)}@media(max-width:600px){main{padding:24px 18px}.edition,.chapter{display:none}.intro{padding:26px 0}.intro p{font-size:11px;letter-spacing:1px}.canvas>svg{width:150%;max-width:none;margin-left:-25%}.badge{top:16px;left:16px;font-size:8px}.caption{font-size:12px;bottom:14px;right:14px}.panel{flex-wrap:wrap;gap:16px}footer{font-size:9px}.speed{flex:1;justify-content:flex-end}input{width:80px}}

<div class="caption">Somewhere between sea &amp; sky.</div>
</section>
<div class="panel"><div class="buttons"><button id="toggle" type="button" aria-pressed="false">Ⅱ 暂停兜风</button><button id="bell" type="button" aria-label="按响自行车铃">♧ 叮铃铃</button></div><label class="speed" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speedValue" for="speed">1×</output></label></div>
<footer><span>不必追风，慢慢骑就很好。</span><span>SVG 插画 · 无需联网 · <span id="status" role="status">正在兜风</span></span></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches,speed=1,time=0,last=null,audio;
const parts=Object.fromEntries(['rearWheel','frontWheel','crank','frontLeg','backLeg','frontFoot','backFoot','pedalFront','pedalBack','rider','scarf','clouds','islands','waves','plants','road'].map(id=>[id,$(id)]));
for(let i=0;i<17;i++){const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',`M${i*90-90} ${i%2?519:487}h${i%3?17:29}`);parts.road.appendChild(line);}
function sync(){ $('toggle').textContent=paused?'▶ 继续兜风':'Ⅱ 暂停兜风';$('toggle').setAttribute('aria-pressed',String(paused));$('status').textContent=paused?'停下来，看看海':'正在兜风'; }
$('toggle').addEventListener('click',()=>{paused=!paused;sync();});
$('speed').addEventListener('input',event=>{speed=Number(event.target.value);$('speedValue').textContent=speed+'×';});
reduced.addEventListener('change',event=>{paused=event.matches;sync();});
$('bell').addEventListener('click',async()=>{try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();const now=audio.currentTime;[0,.15].forEach(delay=>{[1480,2220].forEach((frequency,i)=>{const oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,now+delay);gain.gain.linearRampToValueAtTime(i?.035:.09,now+delay+.005);gain.gain.exponentialRampToValueAtTime(.001,now+delay+.7);oscillator.connect(gain).connect(audio.destination);oscillator.start(now+delay);oscillator.stop(now+delay+.72);});});$('status').textContent='叮铃铃，借过一下！';}catch{$('status').textContent='叮铃铃！（当前浏览器未启用声音）';}});
function pose(t){
const angle=t*3.6,deg=angle*180/Math.PI,bob=Math.sin(angle*2)*1.8;
parts.rearWheel.setAttribute('transform',`rotate(${deg*1.7})`);parts.frontWheel.setAttribute('transform',`rotate(${deg*1.7})`);parts.crank.setAttribute('transform',`rotate(${deg} 541 398)`);
for(const [side,phase] of [['front',0],['back',Math.PI]]){const a=angle+phase,x=541+29*Math.cos(a),y=398+29*Math.sin(a),hipX=side==='front'?502:514,hipY=286+bob,dx=x-hipX,dy=y-hipY,d=Math.hypot(dx,dy),h=Math.sqrt(Math.max(0,75*75-d*d/4)),kx=(hipX+x)/2-dy/d*h,ky=(hipY+y)/2+dx/d*h;
parts[side+'Leg'].setAttribute('d',`M${hipX} ${hipY}Q${kx} ${ky} ${kx} ${ky}L${x} ${y}`);parts[side+'Foot'].setAttribute('d',`M${x-9} ${y}q13-3 22 3`);parts[side==='front'?'pedalFront':'pedalBack'].setAttribute('d',`M${x-11} ${y+7}h25`);}
parts.rider.setAttribute('transform',`translate(0 ${bob})`);parts.scarf.setAttribute('transform',`rotate(${Math.sin(angle*2)*3} 540 181)`);
parts.road.setAttribute('transform',`translate(${-((t*110)%180)} 0)`);
parts.waves.setAttribute('transform',`translate(${-((t*8)%30)} 0)`);
parts.clouds.setAttribute('transform',`translate(${-((t*9)%1250)} 0)`);
parts.islands.setAttribute('transform',`translate(${-((t*4)%1250)} 0)`);
[...parts.plants.children].forEach((plant,i)=>{const start=[90,290,900,1060][i],x=((start-t*110)%1240+1240)%1240-60;plant.setAttribute('x',x);});
}
function frame(now){if(last!==null&&!paused&&!document.hidden)time+=Math.min((now-last)/1000,.05)*speed;last=now;pose(time);requestAnimationFrame(frame);}
// Duplicate distant scenery so it wraps without leaving the horizon empty.
for(const id of ['clouds','islands']){const original=[...parts[id].children];for(const offset of [1250,2500])for(const child of original){const copy=child.cloneNode(true);copy.setAttribute('transform',`translate(${offset} 0)`);parts[id].appendChild(copy);}}
sync();requestAnimationFrame(frame);
</script>
