<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕的单车小冒险</title>
  <style>
    :root {
      --ink: #173b48;
      --sea: #9bd8dc;
      --coral: #f2785c;
      --cream: #fff7e7;
      --yellow: #ffcf62;
      --shadow: rgba(23, 59, 72, .18);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #fff9df 0 7%, transparent 7.2%),
        radial-gradient(circle at 90% 86%, #f9b7a4 0 10%, transparent 10.2%),
        linear-gradient(135deg, #c7f0ed, #8ecbd8);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page {
      width: min(1120px, calc(100vw - 32px));
      padding: 28px;
      border: 3px solid rgba(23, 59, 72, .12);
      border-radius: 30px;
      background: rgba(255, 255, 255, .45);
      box-shadow: 0 24px 70px var(--shadow);
      backdrop-filter: blur(8px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin: 0 4px 20px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #31717a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "SimSun", serif;
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: .08em;
      line-height: 1.15;
    }

    .tag {
      padding: 9px 14px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      transform: rotate(3deg);
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 4px solid var(--ink);
      border-radius: 22px;
      background: #c8eff0;
      box-shadow: inset 0 -12px rgba(23, 59, 72, .05);
    }

    svg { display: block; width: 100%; height: auto; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button, .speed {
      min-height: 42px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: var(--cream);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    button { padding: 0 18px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    .speed { display: flex; align-items: center; gap: 10px; padding: 0 15px; }
    input { width: 110px; accent-color: var(--coral); }
    output { min-width: 28px; }

    .hint { margin: 16px 0 0; text-align: center; font-size: 13px; color: #28636d; }

    @media (max-width: 620px) {
      .page { width: calc(100vw - 20px); padding: 16px; border-radius: 20px; }
      header { align-items: flex-start; margin-bottom: 14px; }
      .tag { font-size: 11px; padding: 7px 10px; }
      .stage { border-width: 3px; border-radius: 16px; }
      .speed { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">THE PELICAN PEDAL CLUB</p>
        <h1>鹈鹕蹬蹬车</h1>
      </div>
      <div class="tag">今天也要出发！</div>
    </header>

    <section class="stage" aria-label="一只鹈鹕骑自行车的动态插画">
      <svg id="scene" viewBox="0 0 1100 620" role="img" aria-labelledby="artTitle artDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="artTitle">鹈鹕骑着自行车穿过海边小路</title>
        <desc id="artDesc">戴黄色小帽的卡通鹈鹕骑着珊瑚色自行车，双腿不断踩踏，云、海鸟、椰树和道路向后移动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#8ed8e0" />
            <stop offset="1" stop-color="#e6f7d2" />
          </linearGradient>
          <linearGradient id="sea" x2="0" y2="1">
            <stop stop-color="#65c7cf" />
            <stop offset="1" stop-color="#9be0d8" />
          </linearGradient>
          <g id="cloud" fill="#fff9e8" stroke="#173b48" stroke-width="4" stroke-linejoin="round">
            <path d="M0 33C4 15 20 6 36 12C45-8 76-8 85 14C105 5 126 18 126 36H0Z" />
          </g>
          <g id="palm" stroke="#173b48" stroke-linecap="round" stroke-linejoin="round">
            <path d="M31 170C39 126 40 72 38 42" fill="none" stroke="#8e7050" stroke-width="13" />
            <path d="M38 48C15 43 5 29 1 11C21 13 34 22 41 39M39 48C54 27 72 22 91 26C78 43 62 50 40 53M39 47C23 25 23 9 31 0C46 13 50 27 44 47M40 52C62 48 78 57 87 71C65 74 51 67 38 56M37 52C23 60 11 59 0 51C10 42 26 42 41 48" fill="#69b878" stroke-width="5" />
            <path d="M26 93h24M24 122h24M20 149h23" stroke="#d8b27a" stroke-width="3" />
          </g>
          <g id="flower" stroke="#173b48" stroke-width="3" stroke-linejoin="round">
            <circle r="6" fill="#ffcf62" />
            <circle cx="0" cy="-13" r="7" fill="#f2785c" />
            <circle cx="12" cy="-4" r="7" fill="#f2785c" />
            <circle cx="8" cy="10" r="7" fill="#f2785c" />
            <circle cx="-8" cy="10" r="7" fill="#f2785c" />
            <circle cx="-12" cy="-4" r="7" fill="#f2785c" />
          </g>
          <g id="spokes" stroke="#173b48" stroke-width="3" stroke-linecap="round">
            <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-24-57L24 57M-57-24L57 24M-57 24L57-24M-24 57L24-57" />
            <circle r="8" fill="#ffcf62" />
          </g>
        </defs>

        <rect width="1100" height="620" fill="url(#sky)" />
        <circle cx="895" cy="94" r="51" fill="#ffcf62" stroke="#173b48" stroke-width="5" />
        <path d="M832 94h126M895 31v126M850 49l90 90M850 139l90-90" stroke="#fff9e8" stroke-width="4" stroke-linecap="round" />

        <g id="clouds" opacity=".96">
          <use href="#cloud" x="-60" y="92" />
          <use href="#cloud" x="330" y="55" transform="scale(.75)" />
          <use href="#cloud" x="745" y="132" transform="scale(.65)" />
          <use href="#cloud" x="1120" y="78" />
        </g>

        <g id="birds" fill="none" stroke="#173b48" stroke-width="4" stroke-linecap="round">
          <path d="M170 131q12-12 24 0 12-12 24 0M265 167q9-9 18 0 9-9 18 0M670 90q10-10 20 0 10-10 20 0" />
        </g>

        <path d="M0 280C140 245 231 297 357 270C500 240 585 300 720 270C875 236 960 291 1100 260V420H0Z" fill="url(#sea)" />
        <g id="waves" fill="none" stroke="#eaffdf" stroke-width="5" stroke-linecap="round" opacity=".75">
          <path d="M15 316q20-13 40 0t40 0M210 343q20-13 40 0t40 0M461 304q20-13 40 0t40 0M710 341q20-13 40 0t40 0M933 305q20-13 40 0t40 0" />
          <path d="M92 376q20-13 40 0t40 0M346 365q20-13 40 0t40 0M605 382q20-13 40 0t40 0M853 371q20-13 40 0t40 0" />
        </g>

        <path d="M0 396C165 358 337 400 503 374C715 340 916 393 1100 366V620H0Z" fill="#9dcc8c" />
        <g id="scenery">
          <use href="#palm" x="72" y="238" />
          <use href="#palm" x="970" y="250" transform="scale(.84)" />
          <g transform="translate(185 472)"><path d="M0 60q11-52 30 0M24 60q13-47 35 0M49 60q9-37 29 0" fill="none" stroke="#39815d" stroke-width="8" stroke-linecap="round" /><use href="#flower" x="17" y="25" /><use href="#flower" x="62" y="37" transform="scale(.7)" /></g>
          <g transform="translate(876 480)"><path d="M0 58q11-50 31 0M24 58q13-42 32 0M45 58q9-35 26 0" fill="none" stroke="#39815d" stroke-width="8" stroke-linecap="round" /><use href="#flower" x="17" y="21" /><use href="#flower" x="57" y="34" transform="scale(.7)" /></g>
        </g>

        <path d="M0 485C212 449 364 500 555 473C744 447 914 488 1100 456V620H0Z" fill="#f9dc9c" stroke="#173b48" stroke-width="5" />
        <path d="M0 555C237 518 396 568 586 539C785 509 940 550 1100 523V620H0Z" fill="#f7b47f" />
        <g id="roadMarks" fill="#fff8df">
          <path d="M-20 570l92-12 15 9-92 13z" /><path d="M210 544l86-11 15 8-87 12z" /><path d="M450 547l95-13 16 8-95 13z" /><path d="M710 530l89-12 16 8-91 12z" /><path d="M955 520l93-13 17 8-94 14z" />
        </g>

        <ellipse cx="545" cy="514" rx="242" ry="25" fill="#173b48" opacity=".16" />

        <g id="bike" stroke="#173b48" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(390 450)">
            <circle r="78" fill="#fff9e8" stroke-width="12" />
            <circle r="68" fill="none" stroke="#6cc4c5" stroke-width="5" />
            <g id="rearSpokes"><use href="#spokes" /></g>
          </g>
          <g transform="translate(686 450)">
            <circle r="78" fill="#fff9e8" stroke-width="12" />
            <circle r="68" fill="none" stroke="#6cc4c5" stroke-width="5" />
            <g id="frontSpokes"><use href="#spokes" /></g>
          </g>
          <path d="M390 450L484 337L545 450ZM484 337H638L545 450M638 337l48 113" fill="none" stroke="#f2785c" stroke-width="12" />
          <path d="M484 337l-12-42M638 337l-8-62q-2-14 12-15h31" fill="none" stroke="#173b48" stroke-width="8" />
          <path d="M454 293q16-11 43-2v11h-43Z" fill="#ffcf62" stroke-width="5" />
          <path d="M664 260h26" stroke="#ffcf62" stroke-width="12" />
          <circle cx="545" cy="450" r="20" fill="#ffcf62" stroke-width="5" />
          <g id="crank"><path d="M518 450h54" stroke-width="6" /></g>
          <path d="M564 331l35-18 23 8" fill="none" stroke="#f2785c" stroke-width="9" />
          <path d="M430 340l-36 15-30-11" fill="none" stroke="#f2785c" stroke-width="9" />
          <circle cx="391" cy="344" r="8" fill="#ffcf62" stroke-width="5" />
          <circle cx="621" cy="321" r="8" fill="#ffcf62" stroke-width="5" />
        </g>

        <g id="pelican" stroke="#173b48" stroke-linejoin="round" stroke-linecap="round">
          <path d="M463 284C411 266 383 240 368 207C405 211 434 226 462 250Z" fill="#eff4d7" stroke-width="5" />
          <path d="M448 268C451 218 478 180 529 179C574 178 604 215 592 273C583 316 551 340 500 329C464 321 441 302 448 268Z" fill="#fff9e8" stroke-width="6" />
          <path d="M514 192C520 151 509 119 527 90C541 68 578 66 592 89C605 110 588 129 579 151L565 208Z" fill="#fff9e8" stroke-width="6" />
          <path d="M571 145C624 147 692 160 752 182C730 223 671 235 619 207C595 194 582 174 571 145Z" fill="#ffb56b" stroke-width="6" />
          <path d="M578 143C638 147 702 161 762 181C767 183 767 190 761 192L575 165Z" fill="#ffcf62" stroke-width="6" />
          <path d="M612 181C645 204 690 205 723 193" fill="none" stroke="#e18459" stroke-width="4" />
          <circle cx="570" cy="136" r="8" fill="#173b48" stroke="none" />
          <circle cx="573" cy="133" r="2.5" fill="#fff" stroke="none" />
          <path d="M540 128q14-10 28-2" fill="none" stroke-width="5" />
          <path d="M523 104l5-25q23-17 49 0l8 27Z" fill="#ffcf62" stroke-width="5" />
          <path d="M516 105q35-10 77 3" fill="none" stroke="#173b48" stroke-width="9" />
          <path id="scarf" d="M526 219C496 212 474 198 448 193L418 207L438 219L426 234C464 231 493 243 527 251Z" fill="#f2785c" stroke-width="5" />
          <path d="M520 222l42 9-7 24-40-12Z" fill="#f2785c" stroke-width="5" />
          <path d="M461 271C488 253 514 255 537 273C574 278 611 268 642 256C650 253 657 258 654 265C626 303 573 315 529 302C494 313 468 301 461 271Z" fill="#fff9e8" stroke-width="6" />
          <path d="M478 286q22 15 45 14M486 303q20 12 37 9" fill="none" stroke="#d8d7b7" stroke-width="4" />
          <path d="M524 296Q556 311 594 302L608 337L511 340Z" fill="#eff4d7" stroke-width="5" />
        </g>

        <g id="legs" fill="none" stroke="#173b48" stroke-linecap="round" stroke-linejoin="round">
          <path id="backLeg" d="M511 325L501 399L527 450" stroke="#ffb56b" stroke-width="16" />
          <path id="frontLeg" d="M550 326L577 393L563 450" stroke="#ffb56b" stroke-width="16" />
          <path id="backFoot" d="M513 452h31" stroke="#ffb56b" stroke-width="13" />
          <path id="frontFoot" d="M549 452h31" stroke="#ffb56b" stroke-width="13" />
          <path id="backPedal" d="M512 461h30" stroke="#173b48" stroke-width="6" />
          <path id="frontPedal" d="M549 461h30" stroke="#173b48" stroke-width="6" />
        </g>

        <g id="speedLines" fill="none" stroke="#173b48" stroke-width="5" stroke-linecap="round" opacity=".38">
          <path d="M90 504h72M135 525h111M807 505h83M840 527h141" />
        </g>
      </svg>
    </section>

    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">Ⅱ 暂停一下</button>
      <button id="restart" type="button">↺ 再骑一圈</button>
      <label class="speed" for="speed">速度 <input id="speed" type="range" min="0.5" max="2" value="1" step="0.25" /><output id="speedValue">1×</output></label>
    </div>
    <p class="hint" id="status" role="status">车轮在转，烦恼往后飞。叮铃铃——让一让！</p>
  </main>

  <script>
    'use strict';

    const get = (id) => document.getElementById(id);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const elements = Object.fromEntries([
      'rearSpokes', 'frontSpokes', 'crank', 'frontLeg', 'backLeg', 'frontFoot', 'backFoot',
      'frontPedal', 'backPedal', 'pelican', 'scarf', 'clouds', 'waves', 'scenery', 'roadMarks',
      'speedLines'
    ].map((id) => [id, get(id)]));

    let paused = reducedMotion.matches;
    let speed = 1;
    let elapsed = 0;
    let previousTime = null;

    function setStatus() {
      get('toggle').textContent = paused ? '▶ 继续骑行' : 'Ⅱ 暂停一下';
      get('toggle').setAttribute('aria-pressed', String(paused));
      get('status').textContent = paused ? '鹈鹕在等你喊：“继续蹬！”' : '车轮在转，烦恼往后飞。叮铃铃——让一让！';
    }

    function drawPose(time) {
      const cycle = time * 4.2;
      const degrees = cycle * 180 / Math.PI;
      const bob = Math.sin(cycle * 2) * 2;
      const crankX = 545;
      const crankY = 450;

      elements.rearSpokes.setAttribute('transform', `rotate(${degrees * 1.65})`);
      elements.frontSpokes.setAttribute('transform', `rotate(${degrees * 1.65})`);
      elements.crank.setAttribute('transform', `rotate(${degrees} ${crankX} ${crankY})`);

      [['front', 0, 550, 326], ['back', Math.PI, 511, 325]].forEach(([name, phase, hipX, hipY]) => {
        const angle = cycle + phase;
        const pedalX = crankX + Math.cos(angle) * 29;
        const pedalY = crankY + Math.sin(angle) * 29;
        const middleX = (hipX + pedalX) / 2 + Math.sin(angle) * 34;
        const middleY = (hipY + pedalY) / 2 - Math.cos(angle) * 18;

        elements[`${name}Leg`].setAttribute('d', `M${hipX} ${hipY + bob} Q${middleX} ${middleY + bob} ${pedalX} ${pedalY}`);
        elements[`${name}Foot`].setAttribute('d', `M${pedalX - 12} ${pedalY + 2} Q${pedalX + 3} ${pedalY - 3} ${pedalX + 17} ${pedalY + 2}`);
        elements[`${name}Pedal`].setAttribute('d', `M${pedalX - 14} ${pedalY + 11} h29`);
      });

      elements.pelican.setAttribute('transform', `translate(0 ${bob})`);
      elements.scarf.setAttribute('transform', `rotate(${Math.sin(cycle * 2) * 4} 520 220)`);
      elements.clouds.setAttribute('transform', `translate(${-((time * 13) % 1180)} 0)`);
      elements.waves.setAttribute('transform', `translate(${-((time * 22) % 90)} 0)`);
      elements.scenery.setAttribute('transform', `translate(${-((time * 38) % 1100)} 0)`);
      elements.roadMarks.setAttribute('transform', `translate(${-((time * 190) % 230)} 0)`);
      elements.speedLines.setAttribute('opacity', String(.22 + (Math.sin(cycle * 3) + 1) * .14));
    }

    function animate(timestamp) {
      if (previousTime !== null && !paused && !document.hidden) {
        elapsed += Math.min((timestamp - previousTime) / 1000, .05) * speed;
      }
      previousTime = timestamp;
      drawPose(elapsed);
      requestAnimationFrame(animate);
    }

    get('toggle').addEventListener('click', () => {
      paused = !paused;
      setStatus();
    });

    get('restart').addEventListener('click', () => {
      elapsed = 0;
      drawPose(elapsed);
      get('status').textContent = '重新起步！鹈鹕已经把帽子戴正了。';
    });

    get('speed').addEventListener('input', (event) => {
      speed = Number(event.target.value);
      get('speedValue').textContent = `${speed}×`;
    });

    reducedMotion.addEventListener('change', (event) => {
      paused = event.matches;
      setStatus();
    });

    setStatus();
    drawPose(0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
