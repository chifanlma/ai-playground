<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕先生的清晨骑行 · SVG 2D 动画</title>
<style>
  :root{
    --ink:#6b5f4f;        /* 描边暖棕 */
    --paper:#f7f3e8;      /* 纸面奶油 */
    --muted:#a89a80;      /* 弱化文字 */
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh; display:grid; place-items:center;
    background:#e7e1d2;
    font-family:Georgia,"KaiTi","楷体",serif; color:var(--ink);
    padding:24px;
  }
  .card{
    background:var(--paper); border:1px solid #d6cdb8; border-radius:20px;
    box-shadow:0 24px 60px rgba(90,80,60,.18), inset 0 0 0 1px rgba(255,255,255,.5);
    padding:26px 26px 16px; max-width:960px; width:100%;
  }
  .card h1{
    text-align:center; font-size:26px; font-weight:600; letter-spacing:.14em;
  }
  .card .sub{
    text-align:center; font-size:10px; letter-spacing:.34em; color:var(--muted);
    margin:6px 0 14px;
  }
  svg{ display:block; width:100%; height:auto; border-radius:12px; }
  .foot{
    text-align:center; font-size:11px; color:var(--muted); margin-top:12px;
    letter-spacing:.08em;
  }

  /* ---------- 动画 ---------- */
  .spin{ animation:spin 1.5s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .hillFar { animation:slideFar 90s linear infinite; }
  .hillMid { animation:slideMid 50s linear infinite; }
  @keyframes slideFar{ to{ transform:translateX(-900px); } }
  @keyframes slideMid{ to{ transform:translateX(-900px); } }

  .cloud{ animation:cloudPass linear infinite; }
  .c1{ animation-duration:75s; animation-delay:-18s; }
  .c2{ animation-duration:95s; animation-delay:-52s; }
  .birds{ animation:cloudPass 58s linear infinite; animation-delay:-25s; }
  @keyframes cloudPass{ from{ transform:translateX(980px); } to{ transform:translateX(-280px); } }

  .roadDash{ stroke-dasharray:44 66; animation:dashMove 1.8s linear infinite; }
  @keyframes dashMove{ to{ stroke-dashoffset:220px; } }
  .pebbles{ stroke-dasharray:6 94; animation:dashPeb 1.7s linear infinite; }
  @keyframes dashPeb{ to{ stroke-dashoffset:200px; } }
  .tufts{ stroke-dasharray:4 56; animation:dashTuft 1.2s linear infinite; }
  @keyframes dashTuft{ to{ stroke-dashoffset:120px; } }

  .puff{ animation:puff 1.8s ease-out infinite; }
  .puff.p2{ animation-delay:.6s; } .puff.p3{ animation-delay:1.2s; }
  @keyframes puff{
    0%{ transform:translate(0,0) scale(.4); opacity:0; }
    18%{ opacity:.5; }
    100%{ transform:translate(-72px,-14px) scale(1.3); opacity:0; }
  }
  .zip{ animation:zip 1.4s linear infinite; }
  .zip.z2{ animation-delay:.45s; } .zip.z3{ animation-delay:.9s; }
  @keyframes zip{
    0%{ transform:translateX(40px); opacity:0; }
    25%{ opacity:.45; }
    100%{ transform:translateX(-80px); opacity:0; }
  }

  .scarf1{ animation:flap 1.1s ease-in-out infinite alternate; transform-origin:448px 191px; }
  .scarf2{ animation:flap 1.3s ease-in-out infinite alternate-reverse; transform-origin:448px 191px; }
  @keyframes flap{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg); } }

  .wingarm{ animation:idleArm 1.6s ease-in-out infinite alternate; transform-origin:450px 206px; }
  @keyframes idleArm{ from{ transform:rotate(-1.5deg); } to{ transform:rotate(1.5deg); } }

  .pouch{ animation:breathe 2.6s ease-in-out infinite alternate; transform-origin:527px 124px; }
  @keyframes breathe{ from{ transform:scaleY(1); } to{ transform:scaleY(1.045); } }

  .pupil{ animation:blink 4.4s infinite; transform-origin:518px 106px; }
  @keyframes blink{
    0%,91%,100%{ transform:scaleY(1); }
    94%{ transform:scaleY(.08); }
    97%{ transform:scaleY(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .spin,.hillFar,.hillMid,.cloud,.birds,.roadDash,.pebbles,.tufts,
    .puff,.zip,.scarf1,.scarf2,.wingarm,.pouch,.pupil{ animation:none; }
  }
</style>
</head>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const BB = { x:438, y:380 };   // 中轴（曲柄圆心）
  const CRANK = 30;              // 曲柄半径
  const HIP = { x:412, y:242 };  // 髋关节
  const L1 = 88, L2 = 88;        // 大腿 / 小腿长度
  const OMEGA = 2*Math.PI/1.6;   // 踏频：1.6 秒一圈

  const pelican = $('pelican');
  const legs = [
    { tu:$('t1u'), to:$('t1o'), su:$('s1u'), so:$('s1o'), foot:$('f1'), pedal:$('pF'), arm:$('armF') },
    { tu:$('t2u'), to:$('t2o'), su:$('s2u'), so:$('s2o'), foot:$('f2'), pedal:$('pN'), arm:$('armN') }
  ];

  function setLine(el, x1, y1, x2, y2){
    el.setAttribute('x1', x1); el.setAttribute('y1', y1);
    el.setAttribute('x2', x2); el.setAttribute('y2', y2);
  }

  // 两连杆 IK：已知髋和脚踝位置，反解膝盖（膝盖始终朝前弯）
  function knee(hx, hy, fx, fy){
    const dx = fx-hx, dy = fy-hy;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, L1+L2-0.5);
    const a = d/2;
    const h = Math.sqrt(Math.max(L1*L1 - a*a, 0));
    const ux = dx/d, uy = dy/d;
    return { kx: hx + ux*a + uy*h, ky: hy + uy*a - ux*h };
  }

  function draw(theta){
    const bob = Math.sin(theta*2)*2.4;          // 身体随踏频轻轻起伏
    pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    const hy = HIP.y + bob;

    legs.forEach((leg, i) => {
      const a = theta + i*Math.PI;              // 两条腿相位差 180°
      const px = BB.x + CRANK*Math.cos(a);
      const py = BB.y + CRANK*Math.sin(a);
      const ax = px, ay = py - 9;               // 脚踝略高于踏板

      const k = knee(HIP.x, hy, ax, ay);
      setLine(leg.tu, HIP.x, hy, k.kx, k.ky);
      setLine(leg.to, HIP.x, hy, k.kx, k.ky);
      setLine(leg.su, k.kx, k.ky, ax, ay);
      setLine(leg.so, k.kx, k.ky, ax, ay);
      leg.foot.setAttribute('transform',
        'translate(' + px.toFixed(1) + ' ' + (py-7).toFixed(1) + ') rotate(' + (Math.sin(a)*7).toFixed(1) + ')');
      leg.pedal.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ')');
      setLine(leg.arm, BB.x, BB.y, px, py);
    });
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches){
    draw(0.9);
  } else {
    const t0 = performance.now();
    (function loop(now){
      draw(((now - t0)/1000) * OMEGA);
      requestAnimationFrame(loop);
    })(t0);
  }
})();
</script>
</body>
</html>
