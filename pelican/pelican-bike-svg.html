<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
:root{--ink:#4c4942;--paper:#f8f3e7;--sage:#a9b99b;--coral:#c98478;--ochre:#dba25c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{display:grid;place-items:center;padding:20px;background:#dfe5d9;color:var(--ink);font-family:Georgia,"Microsoft YaHei",serif}.frame{width:min(980px,100%);padding:22px 22px 14px;background:var(--paper);border:1px solid #d2c8b5;border-radius:18px;box-shadow:0 22px 55px #686d6240}.title{text-align:center;margin:0;font-size:clamp(20px,3vw,29px);letter-spacing:.16em;font-weight:600}.subtitle{text-align:center;margin:7px 0 15px;color:#9d927e;font-size:10px;letter-spacing:.28em}svg{display:block;width:100%;height:auto;border-radius:11px;background:#edf0df}.note{text-align:center;margin:11px 0 0;color:#9d927e;font-size:11px;letter-spacing:.08em}.wheel-spokes{transform-box:fill-box;transform-origin:center;animation:spin 1.15s linear infinite}.cloud{animation:drift 32s linear infinite}.cloud.two{animation-duration:46s;animation-delay:-20s}.road{stroke-dasharray:50 72;animation:road 1.35s linear infinite}.dust{animation:dust 1.7s ease-out infinite}.dust:nth-child(2){animation-delay:.55s}.dust:nth-child(3){animation-delay:1.1s}.scarf{transform-origin:440px 190px;animation:flap 1.1s ease-in-out infinite alternate}.body{transform-origin:400px 220px;animation:bob .58s ease-in-out infinite alternate}.blink{transform-origin:513px 109px;animation:blink 4.2s infinite}.wing{transform-origin:444px 210px;animation:wing .9s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{from{transform:translateX(980px)}to{transform:translateX(-300px)}}@keyframes road{to{stroke-dashoffset:244px}}@keyframes dust{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.48}100%{opacity:0;transform:translate(-65px,-17px) scale(1.35)}}@keyframes flap{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}@keyframes bob{to{transform:translateY(-3px) rotate(-.7deg)}}@keyframes wing{to{transform:rotate(7deg)}}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-play-state:paused!important}}
</style>
</head>
<body>
<main class="frame">
<h1 class="title">鹈鹕先生的清晨骑行</h1><p class="subtitle">LE PÉLICAN À BICYCLETTE · SVG 2D</p>
<svg viewBox="0 0 900 560" role="img" aria-label="戴贝雷帽的鹈鹕骑着自行车，车筐里放着法棍">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f7f3e8"/><stop offset="1" stop-color="#e5ead9"/></linearGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#d9d3c3"/><stop offset="1" stop-color="#bcb8ad"/></linearGradient><radialGradient id="sun"><stop stop-color="#efd493" stop-opacity=".7"/><stop offset="1" stop-color="#efd493" stop-opacity="0"/></radialGradient>
</defs>
<rect width="900" height="560" fill="url(#sky)"/><circle cx="778" cy="87" r="100" fill="url(#sun)"/><circle cx="778" cy="87" r="34" fill="#e9c779"/>
<g class="cloud" fill="#fffaf0" opacity=".78"><ellipse cx="35" cy="106" rx="43" ry="18"/><circle cx="3" cy="100" r="22"/><circle cx="40" cy="88" r="29"/><circle cx="72" cy="103" r="20"/></g><g class="cloud two" fill="#fffaf0" opacity=".62"><ellipse cx="390" cy="150" rx="48" ry="15"/><circle cx="355" cy="145" r="21"/><circle cx="400" cy="133" r="28"/></g>
<path d="M0 365Q120 285 255 350T520 340T790 347T900 320V465H0Z" fill="#bcc9ad"/><rect y="430" width="900" height="130" fill="#aabc9e"/><path d="M0 452H900V560H0Z" fill="url(#road)"/><path d="M0 458H900" stroke="#b6ae9d" stroke-width="4"/><path class="road" d="M-80 512H980" fill="none" stroke="#f2ecdc" stroke-width="8" stroke-linecap="round"/>

<!-- bicycle -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#4d4942" stroke-width="12"><circle cx="300" cy="378" r="72"/><circle cx="590" cy="378" r="72"/></g><g stroke="#eee7d6" stroke-width="4"><circle cx="300" cy="378" r="62"/><circle cx="590" cy="378" r="62"/></g><g class="wheel-spokes" stroke="#8f9186" stroke-width="2"><path d="M300 306v144M228 378h144M249 327l102 102M249 429l102-102"/><path d="M590 306v144M518 378h144M539 327l102 102M539 429l102-102"/></g><path d="M300 378l112-104 76 104H300ZM412 274l143 14-67 94M555 288l35 90" stroke="#718c9b" stroke-width="9"/><path d="M545 275h40M397 257h35" stroke="#524d45" stroke-width="8"/><circle cx="488" cy="378" r="13" stroke="#524d45" stroke-width="5"/><path d="M488 378l30-28M488 378l-29 28" stroke="#524d45" stroke-width="6"/><path d="M514 349h23M458 406h-23" stroke="#524d45" stroke-width="5"/></g>
<!-- basket --> <path d="M568 287h83l-9 45h-65Z" fill="#b69362" stroke="#594e42" stroke-width="2"/><path d="M574 300h71M577 316h66" stroke="#947344" stroke-width="2"/><path d="M603 287c-3-20-8-32-13-41M615 287c5-17 9-26 16-36" stroke="#769174" stroke-width="3" fill="none"/><circle cx="588" cy="243" r="6" fill="#cf958d" stroke="#594e42" stroke-width="2"/><path d="M630 275c12-27 25-48 38-53 6-2 10 3 7 10l-31 47Z" fill="#e5c791" stroke="#594e42" stroke-width="2"/>
<!-- rider --> <g class="body"><path d="M355 203q-35-19-59-7 21 17 58 22M357 214q-33-4-52 13 27 3 53-5" fill="#efe6d4" stroke="#594e42" stroke-width="2"/><path d="M445 196c11-33 31-53 54-70 9-7 12-13 13-20" fill="none" stroke="#594e42" stroke-width="27"/><path d="M445 196c11-33 31-53 54-70 9-7 12-13 13-20" fill="none" stroke="#faf6eb" stroke-width="22"/><ellipse cx="402" cy="216" rx="64" ry="49" transform="rotate(-10 402 216)" fill="#faf6eb" stroke="#594e42" stroke-width="2.5"/><ellipse cx="396" cy="240" rx="50" ry="22" fill="#e8ddc5"/><path class="wing" d="M444 202c29 11 55 36 81 57 5 5 2 12-6 10-31-10-58-31-78-52Z" fill="#f0e6d0" stroke="#594e42" stroke-width="2"/><circle cx="510" cy="116" r="27" fill="#faf6eb" stroke="#594e42" stroke-width="2.5"/><ellipse cx="503" cy="91" rx="26" ry="10" fill="#879bb0" stroke="#594e42" stroke-width="2" transform="rotate(-8 503 91)"/><circle cx="517" cy="107" r="6" fill="#fff" stroke="#594e42" stroke-width="1.5"/><g class="blink"><circle cx="518" cy="107" r="3" fill="#3f3a33"/></g><path d="M527 104c35 4 91 19 125 37l-2 11c-35-9-91-22-125-28Z" fill="#dda15b" stroke="#594e42" stroke-width="2"/><path d="M526 123c12 37 38 53 69 48 27-5 48-16 57-23l-125-25Z" fill="#d18f4e" stroke="#594e42" stroke-width="2"/><path class="scarf" d="M447 193c-22 7-38 20-52 35 19-6 39-13 52-22Z" fill="#ca8d86" stroke="#594e42" stroke-width="2"/><path class="scarf" d="M448 195c-12 15-17 28-20 42 14-13 24-25 29-39Z" fill="#ca8d86" stroke="#594e42" stroke-width="2"/><circle cx="448" cy="192" r="8" fill="#ca8d86" stroke="#594e42" stroke-width="2"/></g>
<!-- legs animated by JS --> <g fill="none" stroke-linecap="round"><line id="thigh" stroke="#5b5147" stroke-width="18"/><line id="shin" stroke="#dfd2b8" stroke-width="13"/></g><path id="foot" d="M-14 10l29-2-7-13Z" fill="#d89d57" stroke="#594e42" stroke-width="2"/>
<text x="868" y="541" text-anchor="end" fill="#a2947d" font-size="11" font-style="italic">M. Pélécan, 1897</text>
</svg><p class="note">纯 SVG 手绘 · 车轮滚动 · 围巾飘动 · 双腿实时踩踏</p>
</main>
<script>
const thigh=document.querySelector('#thigh'),shin=document.querySelector('#shin'),foot=document.querySelector('#foot');const hip={x:407,y:248},hub={x:488,y:378},r=29,L=88;function line(el,a,b){el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y)}function frame(t){const a=t*6.2,ankle={x:hub.x+r*Math.cos(a),y:hub.y+r*Math.sin(a)},dx=ankle.x-hip.x,dy=ankle.y-hip.y,d=Math.hypot(dx,dy),q=Math.min(d,L*2-.1),m=q/2,h=Math.sqrt(Math.max(L*L-m*m,0)),ux=dx/d,uy=dy/d,k={x:hip.x+ux*m+uy*h,y:hip.y+uy*m-ux*h};line(thigh,hip,k);line(shin,k,ankle);foot.setAttribute('transform',`translate(${ankle.x} ${ankle.y-7}) rotate(${Math.sin(a)*8})`);requestAnimationFrame(()=>frame((performance.now()/1000)))}frame(0)
</script></body></html>
