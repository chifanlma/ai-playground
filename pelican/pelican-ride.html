    function sineWave(y, amp, len, phase, step) {
      let d = "M-80 " + y;
      for (let x = -80; x <= 1680; x += step) {
        const yy = y + Math.sin((x + phase) * 0.018) * amp;
        d += " L" + x + " " + yy;
      }
      return d;
    }

    function ik(hipX, hipY, footX, footY, len1, len2, dir) {
      let dx = footX - hipX;
      let dy = footY - hipY;
      let dist = Math.hypot(dx, dy);
      const maxd = len1 + len2 - 0.5;
      if (dist < 1) dist = 1;
      if (dist > maxd) {
        dx *= maxd / dist;
        dy *= maxd / dist;
        dist = maxd;
        footX = hipX + dx;
        footY = hipY + dy;
      }
      const cosA = (len1 * len1 + dist * dist - len2 * len2) / (2 * len1 * dist);
      const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
      const base = Math.atan2(dy, dx);
      const k = base + dir * a;
      return {
        kx: hipX + Math.cos(k) * len1,
        ky: hipY + Math.sin(k) * len1,
        fx: footX,
        fy: footY
      };
    }

    function footShape(x, y, ang) {
      const c = Math.cos(ang);
      const s = Math.sin(ang);
      function pt(px, py) {
        return (x + px * c - py * s) + "," + (y + px * s + py * c);
      }
      return "M" + pt(-4, -4) + " L" + pt(18, -6) + " L" + pt(22, 2) + " L" + pt(8, 8) + " L" + pt(-6, 6) + " Z";
    }

    function apply(progress) {
      const tau = progress * Math.PI * 2;
      const wheelDeg = progress * 360 * 3.2;
      const crankDeg = progress * 360 * 3.2;
      const bounce = Math.sin(tau * 3.2) * 5.5;
      const lean = Math.sin(tau * 1.6) * 1.4;

      rearSpin.setAttribute("transform", "rotate(" + wheelDeg + ")");
      frontSpin.setAttribute("transform", "rotate(" + wheelDeg + ")");
      crankArms.setAttribute("transform", "rotate(" + crankDeg + ")");

      rider.setAttribute("transform", "translate(0," + bounce + ") rotate(" + lean + " 748 652)");
      contactShadow.setAttribute("transform", "translate(0," + (-bounce * 0.15) + ") scale(" + (1 + bounce * 0.004) + ",1)");
      contactShadow.setAttribute("opacity", String(0.22 + (6 - bounce) * 0.008));

      headBeak.setAttribute("transform", "rotate(" + (Math.sin(tau * 3.2) * 3.2) + " 802 378)");
      pouch.setAttribute("transform", "translate(0," + (Math.sin(tau * 3.2 + 0.6) * 3) + ")");
      wing.setAttribute("transform", "rotate(" + (Math.sin(tau * 3.2) * 2.4) + " 720 520)");
      nearWingHand.setAttribute("transform", "rotate(" + (Math.sin(tau * 3.2) * 2) + " 820 518)");
      fish.setAttribute("transform", "rotate(" + (Math.sin(tau * 6) * 8) + " 54 4)");
      pouchFish.setAttribute("transform", "rotate(" + (Math.sin(tau * 7) * 10) + " 900 448)");

      const crank = crankDeg * Math.PI / 180;
      const cx = 748, cy = 652, arm = 34;
      const nearX = cx + Math.sin(crank) * arm;
      const nearY = cy + Math.cos(crank) * arm;
      const farX = cx - Math.sin(crank) * arm;
      const farY = cy - Math.cos(crank) * arm;

      const hipN = { x: 742, y: 575 + bounce };
      const hipF = { x: 728, y: 572 + bounce };
      const n = ik(hipN.x, hipN.y, nearX, nearY + 4, 46, 44, 1);
      const f = ik(hipF.x, hipF.y, farX, farY + 4, 44, 42, 1);
      nearLegPath.setAttribute("d", "M" + hipN.x + " " + hipN.y + " L" + n.kx + " " + n.ky + " L" + n.fx + " " + n.fy);
      farLegPath.setAttribute("d", "M" + hipF.x + " " + hipF.y + " L" + f.kx + " " + f.ky + " L" + f.fx + " " + f.fy);
      nearFoot.setAttribute("d", footShape(n.fx, n.fy, Math.atan2(n.fy - n.ky, n.fx - n.kx)));
      farFoot.setAttribute("d", footShape(f.fx, f.fy, Math.atan2(f.fy - f.ky, f.fx - f.kx)));

      const road = (progress * 420) % 420;
      let dash = "";
      for (let i = -1; i < 8; i++) {
        const x = i * 220 - road;
        dash += " M" + x + " 710 L" + (x + 92) + " 710";
      }
      dashes.setAttribute("d", dash);
      pebbles.setAttribute("transform", "translate(" + (-road * 0.35) + ",0)");

      cloudA.setAttribute("transform", "translate(" + (-progress * 90) + ",0)");
      cloudB.setAttribute("transform", "translate(" + (-progress * 50) + "," + (Math.sin(tau) * 4) + ")");
      cloudC.setAttribute("transform", "translate(" + (-progress * 30) + ",0)");
      sparkles.setAttribute("opacity", String(0.22 + 0.18 * (0.5 + 0.5 * Math.sin(tau * 2))));
      sparkles.setAttribute("transform", "translate(" + (-progress * 40) + ",0)");

      const ph = progress * 160;
      wave1.setAttribute("d", sineWave(478, 7, 1600, ph, 20));
      wave2.setAttribute("d", sineWave(508, 10, 1600, ph * 1.4 + 40, 22));
      wave3.setAttribute("d", sineWave(548, 8, 1600, ph * 0.8 + 90, 24));
      wave1.setAttribute("opacity", "0.7");
      wave2.setAttribute("opacity", "0.45");
      wave3.setAttribute("opacity", "0.28");

      const flap = 8 + Math.sin(tau * 4) * 6;
      gull1.setAttribute("transform", "translate(" + (Math.sin(tau) * 10) + "," + (Math.cos(tau * 1.3) * 6) + ") rotate(" + (flap - 8) + " 238 250)");
      gull2.setAttribute("transform", "translate(" + (Math.cos(tau * 0.8) * 8) + "," + (Math.sin(tau * 1.1) * 5) + ")");
      gull3.setAttribute("transform", "translate(" + (Math.sin(tau * 0.7) * 12) + ",0)");

      window.__state = {
        p: progress,
        bounce: bounce,
        wheelDeg: wheelDeg,
        frozen: frozen
      };
    }

    Object.defineProperty(window, "__freeze", {
      get: function () { return frozen; },
      set: function (v) { frozen = !!v; }
    });
    window.__setP = function (v) {
      p = ((Number(v) % 1) + 1) % 1;
      t0 = performance.now() - p * CYCLE;
      apply(p);
    };

    function frame(now) {
      if (!frozen) {
        p = ((now - t0) / CYCLE) % 1;
        apply(p);
      }
      requestAnimationFrame(frame);
    }
    apply(0);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
